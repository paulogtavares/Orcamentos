          ${sv?.tipoCobranca === 'hora' ? `<option value="percHoras" ${it.qtdModo === 'percHoras' ? 'selected' : ''}>% das horas</option>` : ''}</select>
          ${it.qtdModo === 'percHoras' ? `<select class="celula" data-ti="${i}" data-k="alocacao">${Object.entries(ALOCACAO).map(([k, l]) => `<option value="${k}" ${(it.alocacao || 'personalizado') === k ? 'selected' : ''}>${l}</option>`).join('')}</select>` : ''}</td>
        <td class="dir"><div class="linha-inline" style="gap:2px;justify-content:flex-end;flex-wrap:nowrap"><input class="celula" style="width:80px" type="number" step="0.1" data-ti="${i}" data-k="${{ porPedido: 'fator', percHoras: 'percHoras' }[it.qtdModo] || 'qtd'}" value="${it.qtdModo === 'porPedido' ? it.fator : it.qtdModo === 'percHoras' ? it.percHoras : it.qtd}" ${it.qtdModo === 'percHoras' && pctAlocacao(it.alocacao) != null ? 'disabled title="Definido em Parâmetros"' : ''}>${it.qtdModo === 'percHoras' ? '<span class="secundario">%</span>' : ''}</div></td>
        <td><button class="botao-icone" onclick="capturarTpl();rascunhoTpl.itens.splice(${i},1);desenharModalTpl()" aria-label="Remover linha">${ICONE.lixo}</button></td></tr>`; }).join('') || `<tr><td colspan="5" class="secundario" style="text-align:center;padding:18px">Nenhum item. Adicione linhas abaixo.</td></tr>`}
      </tbody></table></div>
      <div><button class="botao botao-pequeno" onclick="capturarTpl();rascunhoTpl.itens.push({servicoId:DB.servicos[0].id,qtd:1,qtdModo:'fixa',fator:0});desenharModalTpl()">${ICONE.mais} Adicionar linha</button></div>
    </div>
    <div class="rodape-modal"><button class="botao" onclick="fecharModal()">Cancelar</button><button class="botao botao-primario" onclick="salvarTemplate()">Salvar template</button></div>`, true);
  document.querySelectorAll('[data-ti]').forEach(el => el.addEventListener('change', () => {
    const it = rascunhoTpl.itens[+el.dataset.ti], k = el.dataset.k;
    it[k] = el.tagName === 'SELECT' ? el.value : Number(el.value);
    if (k === 'servicoId') { delete it.natureza; it.qtdModo = 'fixa'; }
    if (k === 'qtdModo' && it.qtdModo === 'percHoras') { it.alocacao = it.alocacao || 'dedicado'; it.percHoras = pctAlocacao(it.alocacao) ?? 0; }
    if (k === 'alocacao' && pctAlocacao(it.alocacao) != null) it.percHoras = pctAlocacao(it.alocacao);
    if (['qtdModo', 'servicoId', 'alocacao'].includes(k)) { capturarTpl(); desenharModalTpl(); }
  }));
}
function capturarTpl() {
  const t = rascunhoTpl; if (!$('t-nome')) return;
  Object.assign(t, { nome: $('t-nome').value, modelo: $('t-modelo').value, descricao: $('t-desc').value });
  Object.assign(t.params, { modoPreco: $('t-modo').value, margem: +$('t-margem').value / 100, imposto: +$('t-imp').value / 100, contingencia: +$('t-cont').value / 100, meses: +$('t-meses').value, pedidosMes: +$('t-ped').value, gmvMes: +$('t-gmv').value, feeGmv: +$('t-fee').value });
}
async function salvarTemplate() {
  capturarTpl();
  if (!rascunhoTpl.nome.trim()) return avisar('Dê um nome ao template.', true);
  try { rascunhoTpl.id ? await api('PUT', `/api/templates/${rascunhoTpl.id}`, rascunhoTpl) : await api('POST', '/api/templates', rascunhoTpl);
    fecharModal(); await carregar(); renderLista('templates'); avisar('Template salvo'); } catch (e) { avisar(e.message, true); }
}
async function excluirTemplate(id) {
  const t = DB.templates.find(x => x.id === id);
  if (!await confirmar('Excluir template', `“${esc(t.nome)}” será excluído. Orçamentos já criados a partir dele não mudam.`, 'Excluir', true)) return;
  try { await api('DELETE', `/api/templates/${id}`); await carregar(); renderLista('templates'); avisar('Template excluído'); } catch (e) { avisar(e.message, true); }
}

// ══════════════════════════════════════════════════════════════════════════
//  Aba Serviços
// ══════════════════════════════════════════════════════════════════════════
function abaServicos() {
  const areas = [...new Set(DB.servicos.map(s => s.area))];
  $('conteudo-aba').innerHTML = `<p class="texto-apoio" style="margin-bottom:12px">Tudo o que pode entrar num orçamento. Itens por hora usam o custo do perfil na tabela de custos.</p>
    <div class="tabela rolagem"><table><thead><tr><th>Serviço</th><th>Cobrança</th><th>Natureza padrão</th><th class="dir">Custo</th><th></th></tr></thead><tbody>
    ${areas.map(a => `<tr class="nivel-1"><td colspan="5">${esc(a)} <span class="secundario">· ${DB.servicos.filter(s => s.area === a).length}</span></td></tr>` + DB.servicos.filter(s => s.area === a).map(s => {
      const pf = DB.perfis.find(p => p.id === s.perfilId);
      const custo = s.tipoCobranca === 'hora' ? (pf ? `${pf.moeda === 'USD' ? 'US$' : 'R$'} ${num(pf.custoHora)}/h` : '<span class="atraso">perfil ausente</span>') : s.tipoCobranca === 'percentual' ? `${num(s.custoUnit)}% do GMV` : `${s.moeda === 'USD' ? 'US$' : 'R$'} ${num(s.custoUnit)} por ${esc(s.unidade)}`;
      return `<tr class="clicavel" onclick="editarServico('${s.id}')"><td style="padding-left:28px"><div class="forte">${esc(s.nome)}</div><div class="secundario">${s.grupo ? `<span class="etiqueta">${esc(s.grupo)}</span> ` : ''}${pf ? esc(pf.nome) : ''}</div></td>
        <td>${COBRANCA[s.tipoCobranca]}</td><td>${chipNat(s.natureza)}</td><td class="valor">${custo}</td><td class="dir"><span class="botao-icone">${ICONE.lapis}</span></td></tr>`; }).join('')).join('')}
    </tbody></table></div>`;
}
function editarServico(id) {
  const s = id ? DB.servicos.find(x => x.id === id) : { nome: '', area: 'Tecnologia', grupo: '', tipoCobranca: 'hora', natureza: 'setup', perfilId: DB.perfis[0]?.id, custoUnit: 0, unidade: 'unidade', moeda: 'BRL' };
  const areas = [...new Set([...DB.servicos.map(x => x.area), 'Tecnologia', 'Operação', 'Logística', 'Gestão'])];
  abrirModal(`${cabecalhoModal(id ? 'Editar serviço' : 'Novo serviço')}
    <div class="corpo-modal">
      <label class="campo"><span class="rotulo-campo">Nome</span><input class="entrada" id="s-nome" value="${esc(s.nome)}"></label>
      <div class="grade-campos" style="grid-template-columns:1fr 1fr">
        <label class="campo"><span class="rotulo-campo">Área</span><input class="entrada" id="s-area" list="s-areas" value="${esc(s.area)}"><datalist id="s-areas">${areas.map(a => `<option value="${esc(a)}">`).join('')}</datalist></label>
        <label class="campo"><span class="rotulo-campo">Grupo (opcional)</span><input class="entrada" id="s-grupo" value="${esc(s.grupo || '')}" placeholder="Ex.: Squad Dev"></label>
        <label class="campo"><span class="rotulo-campo">Cobrança</span><select class="entrada" id="s-tipo">${Object.entries(COBRANCA).map(([k, l]) => `<option value="${k}" ${s.tipoCobranca === k ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
        <label class="campo"><span class="rotulo-campo">Natureza padrão</span><select class="entrada" id="s-nat">${Calc.NATUREZAS.map(n => `<option value="${n}" ${s.natureza === n ? 'selected' : ''}>${NAT[n].nome}</option>`).join('')}</select></label>
      </div>
      <label class="campo" id="s-perfil-campo"><span class="rotulo-campo">Perfil (custo por hora)</span><select class="entrada" id="s-perfil">${DB.perfis.map(p => `<option value="${p.id}" ${s.perfilId === p.id ? 'selected' : ''}>${esc(p.nome)}, ${p.moeda === 'USD' ? 'US$' : 'R$'} ${num(p.custoHora)}/h</option>`).join('')}</select></label>
      <div class="grade-campos" id="s-unit-campos" style="grid-template-columns:1fr 1fr 1fr">
        <label class="campo"><span class="rotulo-campo" id="s-custo-rot">Custo unitário</span><input class="entrada num" type="number" step="0.01" id="s-custo" value="${s.custoUnit || 0}"></label>
        <label class="campo" id="s-moeda-campo"><span class="rotulo-campo">Moeda</span><select class="entrada" id="s-moeda"><option ${s.moeda !== 'USD' ? 'selected' : ''}>BRL</option><option ${s.moeda === 'USD' ? 'selected' : ''}>USD</option></select></label>
        <label class="campo" id="s-un-campo"><span class="rotulo-campo">Unidade</span><input class="entrada" id="s-un" value="${esc(s.unidade || '')}" placeholder="pedido, item, pallet, mês"></label>
      </div>
    </div>
    <div class="rodape-modal">${id ? `<button class="botao botao-perigo-texto esquerda" onclick="excluirServico('${id}')">${ICONE.lixo} Excluir</button>` : ''}<button class="botao" onclick="fecharModal()">Cancelar</button><button class="botao botao-primario" onclick="salvarServico('${id || ''}')">Salvar serviço</button></div>`);
  const sync = () => { const t = $('s-tipo').value;
    $('s-perfil-campo').hidden = t !== 'hora'; $('s-unit-campos').hidden = t === 'hora';
    $('s-moeda-campo').hidden = $('s-un-campo').hidden = t === 'percentual';
    $('s-custo-rot').textContent = t === 'percentual' ? 'Custo (% do GMV)' : t === 'fixo' ? 'Valor fixo' : 'Custo unitário'; };
  $('s-tipo').onchange = sync; sync();
}
async function salvarServico(id) {
  const t = $('s-tipo').value;
  const b = { nome: $('s-nome').value.trim(), area: $('s-area').value.trim() || 'Geral', grupo: $('s-grupo').value.trim(), tipoCobranca: t, natureza: $('s-nat').value };
  if (!b.nome) return avisar('Informe o nome do serviço.', true);
  if (t === 'hora') Object.assign(b, { perfilId: $('s-perfil').value, unidade: 'hora' });
  else Object.assign(b, { custoUnit: +$('s-custo').value, moeda: t === 'percentual' ? 'BRL' : $('s-moeda').value, unidade: t === 'percentual' ? '% GMV' : $('s-un').value.trim() || 'unidade', perfilId: null });
  try { id ? await api('PUT', `/api/servicos/${id}`, b) : await api('POST', '/api/servicos', b); fecharModal(); await carregar(); renderLista('servicos'); avisar('Serviço salvo'); } catch (e) { avisar(e.message, true); }
}
async function excluirServico(id) {
  if (!await confirmar('Excluir serviço', 'O serviço sai do catálogo. Orçamentos existentes mantêm os itens já adicionados.', 'Excluir', true)) return;
  try { await api('DELETE', `/api/servicos/${id}`); await carregar(); renderLista('servicos'); avisar('Serviço excluído'); } catch (e) { avisar(e.message, true); }
}

// ══════════════════════════════════════════════════════════════════════════
//  Aba Custos e parâmetros
// ══════════════════════════════════════════════════════════════════════════
function abaCustos() {
  const s = DB.settings, fx = s.cambio.usd;
  const f = (id, rot, v, passo = 1) => `<label class="campo"><span class="rotulo-campo">${rot}</span><input class="entrada num" type="number" step="${passo}" id="${id}" value="${v}"></label>`;
  $('conteudo-aba').innerHTML = `
    <div class="corpo-editor" style="padding:0">
      <div>
        <div class="tabela rolagem"><table><thead><tr><th>Perfil</th><th>Categoria</th><th>Moeda</th><th class="dir">Custo / hora</th><th class="dir">Em reais</th><th>Ativo</th><th></th></tr></thead><tbody>
        ${DB.perfis.map(p => `<tr>
          <td><input class="celula" style="text-align:left;font-weight:600;min-width:170px" data-p="${p.id}" data-k="nome" value="${esc(p.nome)}"></td>
          <td><input class="celula" style="text-align:left;min-width:110px" data-p="${p.id}" data-k="categoria" value="${esc(p.categoria)}"></td>
          <td><select class="celula" data-p="${p.id}" data-k="moeda"><option ${p.moeda === 'BRL' ? 'selected' : ''}>BRL</option><option ${p.moeda === 'USD' ? 'selected' : ''}>USD</option></select></td>
          <td class="dir"><input class="celula" style="width:96px" type="number" step="0.01" data-p="${p.id}" data-k="custoHora" value="${p.custoHora}"></td>
          <td class="valor">${brl(p.custoHora * (p.moeda === 'USD' ? fx : 1))}</td>
          <td><input type="checkbox" style="accent-color:var(--tinta);width:16px;height:16px" data-p="${p.id}" data-k="ativo" ${p.ativo !== false ? 'checked' : ''} aria-label="Ativo"></td>
          <td><button class="botao-icone" onclick="excluirPerfil('${p.id}')" aria-label="Excluir ${esc(p.nome)}">${ICONE.lixo}</button></td></tr>`).join('')}
        </tbody></table></div>
        <p class="dica-campo" style="margin-top:8px">Mudanças valem para novos orçamentos. Os existentes mantêm o custo congelado até alguém usar “Atualizar custos”.</p>
      </div>
      <aside>
        <div class="cartao"><div class="cartao-cabecalho"><h2>Dólar</h2><span class="secundario">${esc(s.cambio.fonte)}, ${data(s.cambio.atualizadoEm)}</span></div><div class="cartao-corpo" style="display:flex;flex-direction:column;gap:12px">
          ${f('p-usd', 'Cotação (R$)', fx, 0.0001)}
          <div class="linha-inline"><button class="botao" onclick="salvarDolar()">Salvar valor</button><button class="botao botao-primario" onclick="buscarPtax()">Buscar PTAX</button></div>
          <p class="dica-campo">Perfis em USD (squad LATAM) usam esta cotação. Cada orçamento congela o dólar do dia em que foi criado.</p>
        </div></div>
        <div class="cartao"><div class="cartao-cabecalho"><h2>Regras de preço</h2></div><div class="cartao-corpo" style="display:flex;flex-direction:column;gap:12px">
          <div class="grade-campos" style="grid-template-columns:1fr 1fr">
            ${f('p-alvo', 'Margem alvo %', +(s.margemAlvo * 100).toFixed(2), 0.5)}${f('p-min', 'Margem mínima %', +(s.margemMinima * 100).toFixed(2), 0.5)}
            ${f('p-imp', 'Impostos padrão %', +(s.impostoPadrao * 100).toFixed(2), 0.01)}${f('p-cont', 'Contingência %', +(s.contingenciaPadrao * 100).toFixed(2), 0.5)}
            <label class="campo"><span class="rotulo-campo">Modo padrão</span><select class="entrada" id="p-modo"><option value="margem" ${s.modoPrecoPadrao === 'margem' ? 'selected' : ''}>Margem</option><option value="markup" ${s.modoPrecoPadrao === 'markup' ? 'selected' : ''}>Markup</option></select></label>
            ${f('p-val', 'Validade (dias)', s.validadeDias)}
            ${f('p-gpd', 'GP dedicado %', s.gpDedicadoPct ?? 25, 0.5)}${f('p-gpc', 'GP compartilhado %', s.gpCompartilhadoPct ?? 10, 0.5)}
            <p class="dica-campo" style="grid-column:1/-1">Percentual aplicado sobre a soma das horas da mesma natureza (ex.: 510 h de setup × 25% = 127,5 h de GP). Use “Atualizar custos” para aplicar em orçamentos existentes.</p>
            <label class="campo" style="grid-column:1/-1"><span class="rotulo-campo">Empresa na proposta</span><input class="entrada" id="p-emp" value="${esc(s.empresa)}"></label>
          </div>
          <div><button class="botao botao-primario" onclick="salvarRegras()">Salvar regras</button></div>
          <p class="dica-campo">Abaixo da margem mínima, o orçamento só vai ao cliente depois de aprovado. Confirme a alíquota com o fiscal.</p>
        </div></div>
      </aside>
    </div>`;
  document.querySelectorAll('[data-p]').forEach(el => el.addEventListener('change', async () => {
    const k = el.dataset.k, v = el.type === 'checkbox' ? el.checked : el.type === 'number' ? Number(el.value) : el.value;
    try { await api('PUT', `/api/perfis/${el.dataset.p}`, { [k]: v }); await carregar(); if (k === 'custoHora' || k === 'moeda') abaCustos(); avisar('Tabela de custos atualizada'); } catch (e) { avisar(e.message, true); }
  }));
}
async function novoPerfil() {
  const nome = await pedirTexto('Novo perfil', 'Nome do perfil', '', 'Criar perfil', true); if (!nome) return;
  try { await api('POST', '/api/perfis', { nome: nome.trim(), categoria: 'Geral', moeda: 'BRL', custoHora: 0 }); await carregar(); renderLista('custos'); avisar('Perfil criado. Informe o custo por hora.'); } catch (e) { avisar(e.message, true); }
}
async function excluirPerfil(id) {
  if (!await confirmar('Excluir perfil', 'O perfil sai da tabela de custos.', 'Excluir', true)) return;
  try { await api('DELETE', `/api/perfis/${id}`); await carregar(); renderLista('custos'); } catch (e) { avisar(e.message, true); }
}
async function salvarRegras() {
  try { await api('PUT', '/api/settings', { margemAlvo: +$('p-alvo').value / 100, margemMinima: +$('p-min').value / 100, impostoPadrao: +$('p-imp').value / 100, contingenciaPadrao: +$('p-cont').value / 100, modoPrecoPadrao: $('p-modo').value, validadeDias: +$('p-val').value, empresa: $('p-emp').value, gpDedicadoPct: +$('p-gpd').value, gpCompartilhadoPct: +$('p-gpc').value });
    await carregar(); avisar('Regras salvas'); } catch (e) { avisar(e.message, true); }
}
async function salvarDolar() {
  try { await api('PUT', '/api/settings', { cambio: { usd: +$('p-usd').value, fonte: 'manual', atualizadoEm: new Date().toISOString() } }); await carregar(); renderLista('custos'); avisar('Dólar atualizado'); } catch (e) { avisar(e.message, true); }
}
async function buscarPtax() {
  try { const r = await api('POST', '/api/cambio/ptax'); await carregar(); renderLista('custos'); avisar(`PTAX: R$ ${num(r.usd, 4)}`); } catch (e) { avisar(e.message, true); }
}
async function restaurar(file) {
  if (!file) return;
  if (!await confirmar('Restaurar backup', `Todos os dados serão substituídos por <b>${esc(file.name)}</b>. O banco atual é copiado antes, por segurança.`, 'Restaurar', true)) return;
  try { await api('POST', '/api/restore', JSON.parse(await file.text())); await carregar(); irPara('orcamentos'); rota(); avisar('Backup restaurado'); } catch (e) { avisar(e.message, true); }
}

// ══════════════════════════════════════════════════════════════════════════
//  Início
// ══════════════════════════════════════════════════════════════════════════
(async () => {
  try {
    const st = await api('GET', '/api/status');
    const d = st.buildDate?.split('-'); $('versao').textContent = `v${st.version} · ${d ? `${d[2]}/${d[1]}/${d[0]}` : ''}`;
    await carregar(); rota();
  } catch (e) {
    app().innerHTML = `<div class="pagina"><div class="vazio"><strong>Não foi possível conectar ao servidor</strong><p>${esc(e.message)}</p><p>Inicie com o iniciar.bat ou com <code>node server.js</code>.</p></div></div>`;
  }
})();
</script>
</body>
</html>
